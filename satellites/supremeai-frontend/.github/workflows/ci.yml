name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies (reproducible)
        run: npm ci --no-audit --no-fund

      - name: Audit production dependencies
        run: npm run audit:prod

      - name: Typecheck
        run: npm run lint

      - name: i18n guard (no new hardcoded UI strings)
        run: npm run i18n:check

      - name: ESLint
        run: npm run lint:eslint

      - name: Prettier
        run: npm run format:check

      - name: Ratchets (raw fetch, explicit any)
        run: npm run http:check && npm run any:check

      - name: Unit tests + coverage gate
        run: npm run test:coverage

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: coverage/lcov.info
          retention-days: 7
          if-no-files-found: warn

      - name: Production build
        run: npm run build

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist
          retention-days: 7
          if-no-files-found: error

  hygiene:
    name: Pre-commit hook parity
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies (reproducible)
        run: npm ci --no-audit --no-fund

      - name: Verify hook is runnable and passes
        run: |
          sh .githooks/pre-commit

  auto-merge:
    name: Auto-Merge PR (Gated)
    needs: [verify, hygiene]
    if: github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify checks and auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          VERIFY_RES: ${{ needs.verify.result }}
          HYGIENE_RES: ${{ needs.hygiene.result }}
        run: |
          echo "=== Auto-Merge Pre-Landing Gate Evaluation ==="
          echo "Verify Gate: $VERIFY_RES"
          echo "Hygiene Gate: $HYGIENE_RES"
          if [ "$VERIFY_RES" != "success" ] || [ "$HYGIENE_RES" != "success" ]; then
            echo "::error::Required gates did not succeed. Auto-merge blocked."
            exit 1
          fi
          echo "All required gates 100% green."
          echo "Queueing autonomous squash landing to main for PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch || gh pr merge "$PR_NUMBER" --squash --delete-branch || true
