name: E2E smoke

# Manual until the first green run on a real browser image: the suite is
# UI-structural and backend-tolerant, but browsers add ~3 min to every PR.
on:
  workflow_dispatch:
    inputs:
      base_url:
        description: 'Base URL to test (leave empty to boot the app locally)'
        required: false
        default: ''

permissions:
  contents: read

jobs:
  smoke:
    name: Playwright smoke (chromium)
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install chromium
        run: npx playwright install --with-deps chromium

      - name: Run smoke suite
        env:
          E2E_BASE_URL: ${{ inputs.base_url }}
          CI: 'true'
        run: npm run e2e

      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report
          retention-days: 7
          if-no-files-found: warn
