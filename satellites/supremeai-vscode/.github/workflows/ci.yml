name: "VSCode Extension CI"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: vscode-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: "Compile & Test Extension"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Compile extension
        run: npm run compile

      - name: Run extension tests
        run: npm test

  auto-merge:
    name: "Auto-Merge PR (Gated)"
    needs: [test]
    if: github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify checks and auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          TEST_RES: ${{ needs.test.result }}
        run: |
          echo "=== Auto-Merge Pre-Landing Gate Evaluation ==="
          echo "Test Gate: $TEST_RES"
          if [ "$TEST_RES" != "success" ]; then
            echo "::error::Required test gate did not succeed. Auto-merge blocked."
            exit 1
          fi
          echo "All required gates 100% green."
          echo "Queueing autonomous squash landing to main for PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch || gh pr merge "$PR_NUMBER" --squash --delete-branch || true
