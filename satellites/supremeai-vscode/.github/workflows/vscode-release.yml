name: "SupremeAI VS Code Extension Build & Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      release_version:
        description: "Release Version Tag (e.g. v0.1.0)"
        required: false
        default: "v0.1.0"
      publish_release:
        description: "Publish to GitHub Releases"
        required: true
        type: boolean
        default: true
      draft:
        description: "Create draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-and-release:
    name: "Build .vsix and Publish"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm ci || npm install

      - name: Compile extension
        run: npm run compile

      - name: Run extension tests
        run: npm test

      - name: Package VSIX
        run: npx --yes @vscode/vsce package --no-git-tag-version --out supremeai-vscode.vsix

      - name: Determine Version
        id: version
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "push" && "${{ github.ref_type }}" == "tag" ]]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [[ -n "${{ github.event.inputs.release_version }}" ]]; then
            echo "tag=${{ github.event.inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            VER=$(node -p "require('./package.json').version")
            echo "tag=v${VER}" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload VSIX Artifact
        uses: actions/upload-artifact@v4
        with:
          name: supremeai-vscode-vsix
          path: supremeai-vscode.vsix
          if-no-files-found: error

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event.inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SupremeAI VS Code Extension ${{ steps.version.outputs.tag }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: supremeai-vscode.vsix
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
