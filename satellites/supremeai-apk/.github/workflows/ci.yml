name: "Android APK CI"

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apk-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: "Assemble Debug APK"
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"
          cache: "gradle"

      - name: Prepare Environment
        run: |
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Assemble Debug APK
        run: ./gradlew assembleDebug --stacktrace

  auto-merge:
    name: "Auto-Merge PR (Gated)"
    needs: [build]
    if: github.event_name == 'pull_request' && !cancelled() && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - name: Verify checks and auto-merge PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BUILD_RES: ${{ needs.build.result }}
        run: |
          echo "=== Auto-Merge Pre-Landing Gate Evaluation ==="
          echo "Build Gate: $BUILD_RES"
          if [ "$BUILD_RES" != "success" ]; then
            echo "::error::Required build gate did not succeed. Auto-merge blocked."
            exit 1
          fi
          echo "All required gates 100% green."
          echo "Queueing autonomous squash landing to main for PR #$PR_NUMBER..."
          gh pr merge "$PR_NUMBER" --auto --squash --delete-branch || gh pr merge "$PR_NUMBER" --squash --delete-branch || true
