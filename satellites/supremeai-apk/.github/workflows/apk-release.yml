name: "SupremeAI Android APK Build & Release"

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      build_type:
        description: "Build Type (debug, release, or both)"
        required: true
        default: "both"
        type: choice
        options:
          - "both"
          - "release"
          - "debug"
      release_version:
        description: "Release Version Tag (e.g. v2.4.0)"
        required: false
        default: "v2.4.0"
      publish_release:
        description: "Publish to GitHub Releases"
        required: true
        type: boolean
        default: true
      draft:
        description: "Create draft release"
        required: false
        type: boolean
        default: false
      prerelease:
        description: "Mark as pre-release"
        required: false
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-apk:
    name: "Build Android APK"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "21"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Prepare Build Environment
        run: |
          # Copy environment properties for secrets plugin
          if [ -f ".env.example" ] && [ ! -f ".env" ]; then
            cp .env.example .env
          elif [ ! -f ".env" ]; then
            touch .env
          fi

          # Ensure gradlew exists
          if [ ! -f "./gradlew" ]; then
            gradle wrapper --gradle-version 8.11.1
          fi
          chmod +x ./gradlew

          # Ensure a debug keystore is present for signing
          if [ ! -f "debug.keystore" ]; then
            keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=SupremeAI Debug,O=SupremeAI,C=BD"
          fi

      - name: Build Debug APK
        if: github.event.inputs.build_type == 'debug' || github.event.inputs.build_type == 'both' || github.event_name == 'push'
        run: ./gradlew assembleDebug --stacktrace

      - name: Build Release APK
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push'
        run: ./gradlew assembleRelease --stacktrace

      - name: Sign Release APK with Keystore (Fallback for Direct Installation)
        if: github.event.inputs.build_type == 'release' || github.event.inputs.build_type == 'both' || github.event_name == 'push'
        run: |
          RELEASE_DIR="app/build/outputs/apk/release"
          if [ -d "$RELEASE_DIR" ]; then
            for apk in "$RELEASE_DIR"/*-unsigned.apk; do
              if [ -f "$apk" ]; then
                SIGNED_APK="${apk%-unsigned.apk}-signed.apk"
                echo "Signing $apk -> $SIGNED_APK"
                jarsigner -verbose -keystore debug.keystore -storepass android -keypass android "$apk" androiddebugkey
                cp "$apk" "$SIGNED_APK"
              fi
            done
          fi

      - name: Determine Version Tag
        id: version
        run: |
          if [ "${{ github.event_name }}" = "push" ] && [ -n "${GITHUB_REF_NAME}" ]; then
            echo "tag=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          elif [ -n "${{ github.event.inputs.release_version }}" ]; then
            echo "tag=${{ github.event.inputs.release_version }}" >> "$GITHUB_OUTPUT"
          else
            echo "tag=v2.4.0" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload APK Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: supremeai-studio-apk
          path: app/build/outputs/apk/**/*.apk
          if-no-files-found: warn

      - name: Publish GitHub Release
        if: github.event_name == 'push' || github.event.inputs.publish_release == true
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "SupremeAI Studio Android ${{ steps.version.outputs.tag }}"
          draft: ${{ github.event.inputs.draft || false }}
          prerelease: ${{ github.event.inputs.prerelease || false }}
          generate_release_notes: true
          files: app/build/outputs/apk/**/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
